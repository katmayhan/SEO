[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["lib/**"]

[functions."cron-daily"]
  schedule = "40 5 * * *"

[functions."cron-weekly"]
  schedule = "20 6 * * 1"

[[redirects]]
  from = "/auth/callback"
  to = "/.netlify/functions/gsc-auth"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache"
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "DENY"
